version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/crypto"]
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/deploy/compose", "/deploy/test"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
