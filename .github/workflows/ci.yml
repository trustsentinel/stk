name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: gofmt (cmd + internal)
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  wasm:
    name: wasm build (browser client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: GOOS=js GOARCH=wasm go build -o /tmp/stk.wasm ./cmd/stk-wasm

  crypto-module:
    name: crypto module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go test ./...
        working-directory: crypto

  security:
    name: govulncheck + gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto # let govulncheck@latest pull the toolchain it needs
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gosec
        continue-on-error: true # advisory for now; tighten once findings are triaged
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" ./...

  e2e:
    name: docker compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build images
        run: docker compose -f deploy/compose/compose.yml build
      - name: run end-to-end test
        run: docker compose -f deploy/compose/compose.yml run --rm e2e
      - name: cleanup
        if: always()
        run: docker compose -f deploy/compose/compose.yml down -v
